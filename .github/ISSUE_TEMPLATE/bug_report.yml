name: Bug report
description: Report behavior that is incorrect or confusing.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please include enough detail to reproduce the problem."
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Select ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python and operating system versions.
    validations:
      required: false
